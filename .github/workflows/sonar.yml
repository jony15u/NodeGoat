name: SonarCloud Analysis

on:
  push:
    branches:
      - app-insegura
      - app-segura
  pull_request:
    branches:
      - app-segura

jobs:
  sonarcloud:
    name: SonarCloud
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v2
        with:
          args: >
            -Dsonar.projectKey=jony15u_NodeGoat
            -Dsonar.organization=jony15u
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
